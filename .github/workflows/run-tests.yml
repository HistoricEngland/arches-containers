name: Run Tests

on:
  pull_request:
    branches:
    - 'dev/**'
    - 'main'

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
        os: ['ubuntu-latest']
        # Python 3.9/3.10 builds are not published for newer Ubuntu runners.
        # Remove these when support is dropped in 1.2.0.
        include:
          - python-version: '3.9'
            os: 'ubuntu-24.04'
          - python-version: '3.10'
            os: 'ubuntu-24.04'
      fail-fast: false

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .[dev]
    
    - name: Run tests
      run: |
        pytest